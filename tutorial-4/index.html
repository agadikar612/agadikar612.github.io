<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RSVP Card | Tutorial 4</title>
  <style>
    :root { --ink:#1e293b; --muted:#64748b; --accent:#4f46e5; --accent-light:#eef2ff; --border:#dbe3ef; --success:#166534; --success-bg:#f0fdf4; --danger:#9f1239; --danger-bg:#fff1f2; }
    * { box-sizing:border-box; }
    body { margin:0; min-height:100vh; display:grid; place-items:center; padding:24px; background:linear-gradient(135deg,#eef2ff,#f8fafc 55%,#e0f2fe); color:var(--ink); font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; }
    .card { width:min(100%,520px); background:#fff; border:1px solid var(--border); border-radius:24px; padding:clamp(24px,5vw,40px); box-shadow:0 20px 60px #33415518; }
    .eyebrow { color:var(--accent); text-transform:uppercase; letter-spacing:.14em; font-size:.76rem; font-weight:800; margin:0 0 10px; }
    h1 { font-size:clamp(2rem,6vw,2.7rem); line-height:1.1; margin:0 0 12px; letter-spacing:-.04em; }
    .intro { color:var(--muted); line-height:1.6; margin:0 0 28px; }
    label { display:block; font-weight:700; font-size:.93rem; margin-bottom:8px; }
    input { width:100%; min-height:48px; border:1px solid var(--border); border-radius:12px; padding:12px 14px; font:inherit; color:var(--ink); outline-offset:3px; }
    input:focus { border-color:var(--accent); outline:2px solid #c7d2fe; }
    .field { margin-bottom:22px; }
    .button-row { display:flex; gap:12px; flex-wrap:wrap; }
    button { flex:1 1 150px; min-height:48px; border-radius:12px; border:1px solid var(--border); background:white; color:var(--ink); font:inherit; font-weight:750; cursor:pointer; transition:background .15s,border-color .15s,transform .15s; }
    button:hover { transform:translateY(-1px); }
    button:focus-visible { outline:3px solid #a5b4fc; outline-offset:3px; }
    button.active { background:var(--accent); color:#fff; border-color:var(--accent); }
    .guest-field { margin-top:20px; }
    .hidden { display:none; }
    .message { margin-top:24px; border-radius:14px; padding:15px 16px; line-height:1.5; font-weight:600; background:var(--accent-light); color:#3730a3; }
    .message.success { background:var(--success-bg); color:var(--success); }
    .message.regret { background:var(--danger-bg); color:var(--danger); }
    .hint { color:var(--muted); font-size:.85rem; margin:18px 0 0; }
  </style>
</head>
<body>
  <main class="card">
    <p class="eyebrow">You're invited</p>
    <h1>Community Social</h1>
    <p class="intro">Join us for an afternoon of conversation, snacks, and meeting new people. Let us know if you can make it.</p>

    <div class="field">
      <label for="guestName">Your name</label>
      <input id="guestName" type="text" placeholder="Enter your name" autocomplete="name">
    </div>

    <div class="field">
      <label>Will you attend?</label>
      <div class="button-row">
        <button id="goingButton" type="button" aria-pressed="false">✓ Going</button>
        <button id="notGoingButton" type="button" aria-pressed="false">Can't make it</button>
      </div>
    </div>

    <div id="guestCountField" class="guest-field hidden">
      <label for="guestCount">Number of guests, including you</label>
      <input id="guestCount" type="number" min="1" max="10" value="1" inputmode="numeric">
    </div>

    <div id="rsvpMessage" class="message" aria-live="polite">Enter your name and choose an RSVP option.</div>
    <p class="hint">You can change your response anytime by choosing the other button.</p>
  </main>

  <script>
    const nameInput = document.querySelector('#guestName');
    const guestCountInput = document.querySelector('#guestCount');
    const guestCountField = document.querySelector('#guestCountField');
    const goingButton = document.querySelector('#goingButton');
    const notGoingButton = document.querySelector('#notGoingButton');
    const message = document.querySelector('#rsvpMessage');

    let response = '';

    function updateMessage() {
      const name = nameInput.value.trim() || 'there';
      if (response === 'going') {
        const count = Math.max(1, Math.min(10, Number(guestCountInput.value) || 1));
        message.textContent = `Thanks, ${name}! You're on the list for ${count} ${count === 1 ? 'guest' : 'guests'}. We look forward to seeing you!`;
        message.className = 'message success';
      } else if (response === 'not-going') {
        message.textContent = `Thanks for letting us know, ${name}. Sorry you can't make it — we'll miss you!`;
        message.className = 'message regret';
      } else {
        message.textContent = `Hi ${name}! Please choose Going or Can't make it to RSVP.`;
        message.className = 'message';
      }
    }

    function setResponse(nextResponse) {
      response = nextResponse;
      const isGoing = response === 'going';
      goingButton.classList.toggle('active', isGoing);
      notGoingButton.classList.toggle('active', !isGoing);
      goingButton.setAttribute('aria-pressed', String(isGoing));
      notGoingButton.setAttribute('aria-pressed', String(!isGoing));
      guestCountField.classList.toggle('hidden', !isGoing);
      updateMessage();
    }

    goingButton.addEventListener('click', () => setResponse('going'));
    notGoingButton.addEventListener('click', () => setResponse('not-going'));
    nameInput.addEventListener('input', updateMessage);
    guestCountInput.addEventListener('input', updateMessage);
  </script>
</body>
</html>
